<template>
  <div class="zeta-app-shell">
    <header class={headerClass}>
      <div class="header-content">
        <div class="header-left">
          <span class="header-brand">{labels.zetaCharterSchools}</span>
        </div>
        <div class="header-right">
          <span
            class={saveStatusDotClass}
            title={saveStatusTooltip}
            aria-live="polite"
          ></span>
        </div>
      </div>
    </header>

    <template lwc:if={enrollmentClosed}>
      <main class="content-area">
        <template lwc:if={hasLandingContent}>
          <div class="landing-content">
            <lightning-formatted-rich-text
              value={landingContent}
            ></lightning-formatted-rich-text>
          </div>
        </template>
        <template lwc:else>
          <div class="closed-card">
            <div class="closed-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="48" height="48">
                <path
                  d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"
                  fill="currentColor"
                />
              </svg>
            </div>
            <h2 class="closed-title">{labels.applicationsClosed}</h2>
          </div>
        </template>
      </main>
    </template>

    <template lwc:else>
      <nav class="stepper-container" aria-label={labels.ariaAppProgress}>
        <ol class="stepper">
          <template for:each={stepperSteps} for:item="step">
            <li
              key={step.number}
              class={step.stepItemClass}
              aria-current={step.ariaCurrent}
              data-step={step.number}
              onclick={handleStepClick}
            >
              <div class={step.circleClass}>
                <template lwc:if={step.isComplete}>
                  <svg
                    class="check-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path
                      d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"
                      fill="currentColor"
                    />
                  </svg>
                </template>
                <template lwc:else>
                  <span class="step-number">{step.number}</span>
                </template>
              </div>
              <span class={step.labelClass}>{step.label}</span>
              <template lwc:if={step.showConnector}>
                <div class={step.connectorClass}></div>
              </template>
            </li>
          </template>
        </ol>
      </nav>

      <template lwc:if={showStudentHeader}>
        <div class="student-header">
          <span class="student-header-text">{studentHeaderText}</span>
        </div>
      </template>

      <template lwc:if={justSubmitted}>
        <main class="content-area">
          <template lwc:if={hasLandingContent}>
            <div class="landing-content-banner">
              <lightning-formatted-rich-text
                value={landingContent}
              ></lightning-formatted-rich-text>
            </div>
          </template>
          <div class="submitted-banner">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
                fill="currentColor"
              />
            </svg>
            <div>
              <h2 class="submitted-banner__title">{labels.submittedTitle}</h2>
              <p class="submitted-banner__message">{submittedDisplayMessage}</p>
            </div>
          </div>
          <c-confirmation-review
            record-id={resolvedRecordId}
            page-dev-name={pageDevName}
            variant={variant}
            read-only
          ></c-confirmation-review>
          <button
            class="btn btn--primary submitted-home-btn"
            onclick={handleReturnHome}
          >
            {labels.returnHome}
          </button>
        </main>
      </template>

      <template lwc:else>
        <main class="content-area">
          <template lwc:if={isLoading}>
            <div
              class="skel-content-card"
              aria-busy="true"
              aria-label={labels.ariaLoadingApp}
            >
              <div class="skel-content-header"></div>
              <div class="skel-content-grid">
                <div class="skel-content-field skel-content-field--w80"></div>
                <div class="skel-content-field skel-content-field--w60"></div>
                <div class="skel-content-field skel-content-field--w45"></div>
                <div class="skel-content-field"></div>
              </div>
              <div
                class="skel-content-header skel-content-header--second"
              ></div>
              <div class="skel-content-grid">
                <div class="skel-content-field skel-content-field--w60"></div>
                <div class="skel-content-field skel-content-field--w80"></div>
              </div>
            </div>
          </template>

          <template lwc:if={showTransitionSkeleton}>
            <div
              class="skel-content-card"
              aria-busy="true"
              aria-label={labels.ariaLoadingNextStep}
            >
              <div class="skel-content-header"></div>
              <div class="skel-content-grid">
                <div class="skel-content-field skel-content-field--w80"></div>
                <div class="skel-content-field skel-content-field--w60"></div>
                <div class="skel-content-field skel-content-field--w45"></div>
              </div>
            </div>
          </template>

          <template lwc:if={isStep1}>
            <template lwc:if={hasLandingContent}>
              <div class="landing-content-banner">
                <lightning-formatted-rich-text
                  value={landingContent}
                ></lightning-formatted-rich-text>
              </div>
            </template>
            <c-student-selection
              record-id={resolvedRecordId}
              is-locked={studentLocked}
              contact-support-url={contactSupportUrl}
              duplicate-blocked={step1DuplicateBlocked}
              oncompletionchange={handleStudentCompletion}
              onsavestatus={handleSaveStatus}
            ></c-student-selection>
          </template>

          <template lwc:if={isStep2}>
            <c-school-selection
              record-id={resolvedRecordId}
              oncompletionchange={handleSchoolCompletion}
            ></c-school-selection>
          </template>

          <template lwc:if={isStep3}>
            <c-school-ranking
              record-id={resolvedRecordId}
              oncompletionchange={handleRankingCompletion}
            ></c-school-ranking>
          </template>

          <template lwc:if={isStep4}>
            <c-application-form-page
              record-id={resolvedRecordId}
              page-dev-name={pageDevName}
              variant={variant}
              embedded
              insert-slot-after-sort-order="5"
              onsavestatus={handleSaveStatus}
              onanswerchange={handleAnswerChange}
              onvisibilitychange={handleVisibilityChange}
            >
              <c-sibling-section
                record-id={resolvedRecordId}
                sibling-attending={siblingAttendingToggle}
                sibling-applying={siblingApplyingToggle}
                onsavestatus={handleSaveStatus}
                oncontrollingreset={handleControllingReset}
              ></c-sibling-section>
            </c-application-form-page>
          </template>

          <template lwc:if={isStep5}>
            <c-confirmation-review
              record-id={resolvedRecordId}
              page-dev-name={pageDevName}
              variant={variant}
              post-submit-mode={postSubmitMode}
              timeline-closed={timelineClosed}
              application-status={applicationStatus}
              onnavigatestep={handleNavigateStep}
            ></c-confirmation-review>
            <template lwc:if={showStandardFooter}>
              <c-e-signature record-id={resolvedRecordId}></c-e-signature>
            </template>
            <template lwc:if={submitError}>
              <div class="submit-error" role="alert">{submitError}</div>
            </template>
          </template>

          <template lwc:if={isStubStep}>
            <div class="stub-card">
              <div class="stub-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="48" height="48">
                  <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
                    fill="currentColor"
                  />
                </svg>
              </div>
              <h2 class="stub-title">{currentStepLabel}</h2>
              <p class="stub-text">{labels.comingSoon}</p>
            </div>
          </template>
        </main>

        <template lwc:if={transitionError}>
          <div class="transition-error" role="alert">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"
                fill="currentColor"
              />
            </svg>
            <span>{transitionError}</span>
          </div>
        </template>

        <template lwc:if={showSubmitConfirm}>
          <div class="modal-backdrop" onclick={handleCancelSubmit}>
            <div
              class="modal-dialog"
              role="alertdialog"
              aria-labelledby="confirm-title"
              aria-describedby="confirm-desc"
              onclick={_stopPropagation}
            >
              <h2 id="confirm-title" class="modal-title">
                {labels.submitAppQuestion}
              </h2>
              <p id="confirm-desc" class="modal-desc">{labels.submitAppDesc}</p>
              <div class="modal-actions">
                <button
                  class="btn btn--secondary"
                  onclick={handleCancelSubmit}
                  disabled={isSubmitting}
                >
                  {labels.goBack}
                </button>
                <button
                  class="btn btn--primary"
                  onclick={handleConfirmSubmit}
                  disabled={isSubmitting}
                >
                  {continueLabel}
                </button>
              </div>
            </div>
          </div>
        </template>

        <template lwc:if={showDraftChoice}>
          <div class="modal-backdrop" onclick={handleStartNewApplication}>
            <div
              class="modal-dialog"
              role="alertdialog"
              aria-labelledby="draft-title"
              aria-describedby="draft-desc"
              onclick={_stopPropagation}
            >
              <h2 id="draft-title" class="modal-title">
                {labels.existingAppFound}
              </h2>
              <p id="draft-desc" class="modal-desc">{labels.existingAppDesc}</p>
              <div class="modal-actions">
                <button
                  class="btn btn--secondary"
                  onclick={handleStartNewApplication}
                >
                  {labels.startNew}
                </button>
                <button class="btn btn--primary" onclick={handleResumeDraft}>
                  {labels.resume}
                </button>
              </div>
            </div>
          </div>
        </template>

        <template lwc:if={isSubmitting}>
          <div class="submitting-overlay" aria-live="assertive">
            <div class="submitting-card">
              <lightning-spinner
                alternative-text={labels.ariaSubmittingApp}
                size="medium"
              ></lightning-spinner>
              <p class="submitting-text">{labels.submitting}</p>
            </div>
          </div>
        </template>

        <template lwc:if={showStandardFooter}>
          <footer class="wizard-footer">
            <div class="footer-content">
              <div class="footer-left">
                <button class="btn btn--secondary" onclick={handleSaveAndExit}>
                  {labels.saveAndExit}
                </button>
              </div>
              <div class="footer-right">
                <span class="step-counter">{stepCounterText}</span>
                <template lwc:if={showBackButton}>
                  <button class="btn btn--secondary" onclick={handleBack}>
                    {labels.back}
                  </button>
                </template>
                <button
                  class="btn btn--primary"
                  onclick={handleNext}
                  disabled={isContinueDisabled}
                >
                  {continueLabel}
                </button>
              </div>
            </div>
          </footer>
        </template>

        <template lwc:if={showPostSubmitStep3Footer}>
          <footer class="wizard-footer">
            <div class="footer-content">
              <div class="footer-left">
                <button
                  class="btn btn--secondary"
                  onclick={handleCancelReturnToReview}
                  disabled={isTransitioning}
                >
                  {labels.cancelReturnToReview}
                </button>
              </div>
              <div class="footer-right">
                <button
                  class="btn btn--primary"
                  onclick={handleSaveAndReturnToReview}
                  disabled={isTransitioning}
                >
                  {labels.saveAndReturnToReview}
                </button>
              </div>
            </div>
          </footer>
        </template>
      </template>
    </template>
  </div>
</template>
