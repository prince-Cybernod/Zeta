<template>
  <div class="sibling-row slds-box slds-m-bottom_small">
    <div class="slds-grid slds-gutters slds-wrap">
      <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small">
        <lightning-input
          label={labels.firstName}
          value={draft.firstName}
          data-field="firstName"
          onchange={handleChange}
          required
        ></lightning-input>
      </div>
      <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small">
        <lightning-input
          label={labels.lastName}
          value={draft.lastName}
          data-field="lastName"
          onchange={handleChange}
          required
        ></lightning-input>
      </div>
      <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small">
        <lightning-input
          type="date"
          label={labels.dateOfBirth}
          value={draft.birthdate}
          data-field="birthdate"
          onchange={handleChange}
          required
        ></lightning-input>
      </div>
      <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small">
        <lightning-combobox
          label={labels.gender}
          value={draft.gender}
          options={genderOptions}
          data-field="gender"
          onchange={handleChange}
        ></lightning-combobox>
      </div>
      <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small">
        <lightning-combobox
          label={labels.currentGrade}
          value={draft.currentGrade}
          options={gradeOptions}
          data-field="currentGrade"
          onchange={handleChange}
        ></lightning-combobox>
      </div>
      <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small">
        <lightning-combobox
          label={labels.gradeApplyingTo}
          value={draft.gradeApplyingTo}
          options={gradeApplyingToOptions}
          data-field="gradeApplyingTo"
          onchange={handleChange}
          required
        ></lightning-combobox>
      </div>
      <template lwc:if={errorMessage}>
        <div
          class="slds-col slds-size_1-of-1 slds-text-color_error slds-p-bottom_x-small"
        >
          {errorMessage}
        </div>
      </template>
      <div class="slds-col slds-size_1-of-1 slds-p-bottom_x-small">
        <lightning-button
          variant="brand"
          label={labels.save}
          onclick={handleSave}
          disabled={saveDisabled}
        ></lightning-button>
        <lightning-button
          variant="neutral"
          label={labels.cancel}
          onclick={handleCancel}
          class="slds-m-left_x-small"
        ></lightning-button>
      </div>
    </div>
  </div>
</template>
