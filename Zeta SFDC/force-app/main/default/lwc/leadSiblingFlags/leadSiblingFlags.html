<template>
  <div lwc:ref="root" onpointermove={trackGlare}>
    <template lwc:if={showToast}>
      <div class={toastClass} onanimationend={toastAnimationEnd}>
        <div class="toast-card" role="status">
          <span class="slds-assistive-text">Information</span>
          <span class="toast-shine" aria-hidden="true"></span>
          <span class="app-glyph toast-glyph" aria-hidden="true">
            <lightning-icon
              icon-name="standard:lead"
              size="small"
            ></lightning-icon>
          </span>
          <div class="toast-copy">
            <h2 class="toast-heading">{toastHeading}</h2>
            <p class="toast-body">
              {toastBody}<button
                class="toast-action slds-button slds-button_reset"
                data-action="toast-view"
                onclick={openMatches}
              >
                {toastAction}
              </button>
            </p>
          </div>
          <lightning-button-icon
            class="toast-close"
            icon-name="utility:close"
            variant="bare"
            alternative-text="Close"
            title="Close"
            data-action="toast-close"
            onclick={dismissToast}
          ></lightning-button-icon>
        </div>
      </div>
    </template>

    <template lwc:if={genie}>
      <div class="genie-stage" style={genie.stageStyle} aria-hidden="true">
        <template for:each={genie.strips} for:item="strip">
          <div class="genie-strip" key={strip.key} style={strip.style}>
            <div class="genie-face">
              <span class="app-glyph genie-glyph"></span>
              <div class="genie-copy">
                <div class="toast-heading">{genie.heading}</div>
                <p class="toast-body">
                  {genie.body}<span class="toast-action">{genie.action}</span>
                </p>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>

    <section class={bannerClass} aria-label="Lead siblings and duplicates">
      <span class="glass-sheen" aria-hidden="true"></span>
      <div>
        <template lwc:if={loading}>
          <lightning-spinner
            size="small"
            alternative-text="Checking for siblings and duplicates"
          ></lightning-spinner>
        </template>
        <template lwc:elseif={error}>
          <p role="alert" class="hero-error">{error}</p>
        </template>
        <template lwc:elseif={showResults}>
          <div class="hero-content">
            <span class="app-glyph hero-glyph">
              <lightning-icon
                icon-name="standard:lead"
                size="small"
                alternative-text="Related records"
              ></lightning-icon>
            </span>
            <div class="hero-copy">
              <template lwc:if={hasMatches}>
                <h2 class="banner-title slds-text-heading_small">
                  It looks as if duplicates or siblings exist for this Lead.
                </h2>
                <ul class="chips" aria-label="Matches found">
                  <template for:each={summaryChips} for:item="chip">
                    <li key={chip.key} class="chip" data-group={chip.key}>
                      {chip.label}
                    </li>
                  </template>
                </ul>
              </template>
              <template lwc:else>
                <p class="banner-title">
                  Related record results are limited. More matches may exist.
                </p>
              </template>
              <button
                type="button"
                class="hero-action glass-button glass-button_prominent"
                data-action="view"
                onclick={openMatches}
              >
                <span>View Here</span>
                <lightning-icon
                  class="hero-action-icon"
                  icon-name="utility:forward"
                  size="xx-small"
                  alternative-text=""
                ></lightning-icon>
              </button>
            </div>
          </div>
        </template>
        <template lwc:else>
          <p class="hero-empty">
            <lightning-icon
              class="hero-empty-icon"
              icon-name="utility:success"
              size="x-small"
              alternative-text=""
            ></lightning-icon>
            <span>No possible siblings or duplicates found.</span>
          </p>
        </template>
      </div>
      <lightning-button-icon
        icon-name="utility:refresh"
        alternative-text="Refresh related records"
        title="Refresh related records"
        data-action="refresh"
        onclick={refresh}
        disabled={loading}
        variant="bare"
      ></lightning-button-icon>
    </section>

    <template lwc:if={isOpen}>
      <dialog
        lwc:ref="dialog"
        aria-labelledby="siblings-heading"
        class={dialogClass}
        oncancel={closeModal}
        onanimationend={dialogAnimationEnd}
      >
        <header class="modal-hero slds-modal__header">
          <div class="modal-title">
            <span class="app-glyph modal-glyph">
              <lightning-icon
                icon-name="standard:lead"
                size="small"
                alternative-text="Related records"
              ></lightning-icon>
            </span>
            <div class="modal-title-copy">
              <h2
                id="siblings-heading"
                class="modal-heading slds-text-heading_medium"
                tabindex="-1"
                lwc:ref="heading"
              >
                Possible Siblings or Duplicate Records
              </h2>
              <template lwc:if={hasMatches}>
                <ul class="chips" aria-label="Matches found">
                  <template for:each={summaryChips} for:item="chip">
                    <li key={chip.key} class="chip" data-group={chip.key}>
                      {chip.label}
                    </li>
                  </template>
                </ul>
              </template>
            </div>
          </div>
        </header>
        <div class="modal-body slds-modal__content slds-is-relative">
          <template lwc:if={busy}>
            <lightning-spinner
              alternative-text="Processing selected Leads"
              size="small"
            ></lightning-spinner>
          </template>
          <template lwc:if={modalError}>
            <p role="alert" class="callout callout_error">{modalError}</p>
          </template>
          <div class="modal-progress">
            <lightning-progress-indicator current-step={step} type="base">
              <lightning-progress-step
                label="Select Leads"
                value="select"
              ></lightning-progress-step>
              <lightning-progress-step
                label="Compare Records"
                value="compare"
              ></lightning-progress-step>
              <lightning-progress-step
                label="Confirm Merge"
                value="confirm"
              ></lightning-progress-step>
            </lightning-progress-indicator>
          </div>
          <template lwc:if={isSelecting}>
            <template lwc:if={matches.limited}>
              <p role="status" class="callout callout_warning">
                Results are limited for this shared contact information. More
                related records may exist.
              </p>
            </template>
            <template for:each={sections} for:item="section">
              <section
                key={section.key}
                class="record-section"
                data-group={section.key}
                aria-label={section.title}
              >
                <header class="record-section-header">
                  <h3 class="record-section-heading">
                    <button
                      type="button"
                      class="record-section-toggle slds-button slds-button_reset"
                      data-section={section.key}
                      aria-expanded={section.expanded}
                      aria-controls={section.bodyId}
                      onclick={toggleSection}
                    >
                      <span class="record-section-chip">
                        <lightning-icon
                          class="record-section-icon"
                          icon-name={section.icon}
                          size="small"
                        ></lightning-icon>
                      </span>
                      <span class="record-section-title">{section.title}</span>
                      <span class="record-section-count">{section.count}</span>
                      <lightning-icon
                        class="record-section-chevron"
                        icon-name="utility:chevronright"
                        size="x-small"
                        alternative-text=""
                      ></lightning-icon>
                    </button>
                  </h3>
                </header>
                <template lwc:if={section.expanded}>
                  <div
                    id={section.bodyId}
                    class="record-section-body"
                    data-section-body
                  >
                    <p class="section-help">{section.help}</p>
                    <template lwc:if={section.canSelect}>
                      <p class="section-note">
                        To compare duplicates, select up to three Leads
                        including the current Lead. Siblings are different
                        children and must remain separate.
                      </p>
                    </template>
                    <template lwc:if={section.hasRows}>
                      <div
                        class="table-scroll slds-scrollable_x"
                        tabindex="0"
                        role="region"
                        aria-label={section.title}
                      >
                        <table
                          class="data-table record-table slds-table slds-no-row-hover"
                          aria-label={section.title}
                        >
                          <colgroup>
                            <col class="name-column" />
                            <col class="phone-column" />
                            <col class="email-column" />
                            <col class="guardian-column" />
                            <col class="status-column" />
                          </colgroup>
                          <thead>
                            <tr>
                              <th scope="col">{section.nameHeading}</th>
                              <th scope="col">Phone</th>
                              <th scope="col">Email</th>
                              <th scope="col">Guardian</th>
                              <th scope="col">Status</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template for:each={section.rows} for:item="row">
                              <tr key={row.id} class={row.rowClass}>
                                <th scope="row">
                                  <div class="row-name">
                                    <template lwc:if={section.canSelect}>
                                      <lightning-input
                                        class="lead-selection"
                                        type="checkbox"
                                        label={row.name}
                                        variant="label-hidden"
                                        data-select={row.id}
                                        checked={row.selected}
                                        disabled={row.selectionDisabled}
                                        onchange={selectLead}
                                      ></lightning-input>
                                    </template>
                                    <a
                                      href={row.url}
                                      target="_blank"
                                      rel="noopener"
                                      >{row.name}</a
                                    >
                                    <template lwc:if={row.isCurrent}>
                                      <span class="current-lead-badge"
                                        >Current Lead</span
                                      >
                                    </template>
                                  </div>
                                </th>
                                <td class="cell-phone">
                                  <lightning-formatted-phone
                                    value={row.phone}
                                  ></lightning-formatted-phone>
                                </td>
                                <td>
                                  <lightning-formatted-email
                                    value={row.email}
                                  ></lightning-formatted-email>
                                </td>
                                <td>{row.guardian}</td>
                                <td>
                                  <template lwc:if={row.status}>
                                    <span class="status-pill"
                                      >{row.status}</span
                                    >
                                  </template>
                                </td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </template>
                    <template lwc:else>
                      <p class="section-empty">No related records found.</p>
                    </template>
                  </div>
                </template>
              </section>
            </template>
          </template>
          <template lwc:elseif={isComparing}>
            <p class="step-intro">
              Choose the Lead to keep, then select the field values to retain.
              Other fields stay on the Lead you keep.
            </p>
            <div
              class="table-card slds-scrollable_x"
              tabindex="0"
              role="region"
              aria-label="Compare selected Leads"
            >
              <table
                class="data-table compare-table slds-table slds-no-row-hover"
                aria-label="Compare selected Leads"
              >
                <thead>
                  <tr>
                    <th scope="col">Field</th>
                    <template for:each={leadHeaders} for:item="record">
                      <th key={record.Id} scope="col">
                        <div class="row-name">
                          <a href={record.url} target="_blank" rel="noopener"
                            >{record.Name}</a
                          >
                          <template lwc:if={record.isCurrent}>
                            <span class="current-lead-badge">Current Lead</span>
                          </template>
                        </div>
                        <div class="keep-choice">
                          <lightning-input
                            type="radio"
                            name="primaryLead"
                            label="Keep this Lead"
                            variant="label-hidden"
                            checked={record.isPrimary}
                            data-record={record.Id}
                            onchange={choosePrimary}
                          ></lightning-input>
                          <span
                            class="keep-label"
                            aria-hidden="true"
                            data-record={record.Id}
                            onclick={choosePrimary}
                            >Keep this Lead</span
                          >
                        </div>
                      </th>
                    </template>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={comparisonRows} for:item="field">
                    <tr key={field.name}>
                      <th scope="row">{field.label}</th>
                      <template for:each={field.choices} for:item="choice">
                        <td key={choice.id} class={choice.cellClass}>
                          <div class="choice">
                            <lightning-input
                              type="radio"
                              name={field.name}
                              label={choice.label}
                              variant="label-hidden"
                              checked={choice.selected}
                              data-field={field.name}
                              data-record={choice.id}
                              onchange={chooseValue}
                            ></lightning-input>
                            <span class="choice-value">{choice.value}</span>
                          </div>
                        </td>
                      </template>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
          <template lwc:else>
            <div class="confirm-card">
              <h3 class="confirm-title">Confirm Lead merge</h3>
              <p>
                Keep
                <a href={primaryRecord.url} target="_blank" rel="noopener"
                  >{primaryRecord.Name}</a
                >
                with your selected field values.
              </p>
              <p class="confirm-subtle">
                These duplicate records will be merged into it and removed:
              </p>
              <ul class="confirm-list">
                <template for:each={removedRecords} for:item="record">
                  <li key={record.Id}>
                    <a href={record.url} target="_blank" rel="noopener"
                      >{record.Name}</a
                    >
                  </li>
                </template>
              </ul>
              <lightning-input
                class="confirm-check"
                type="checkbox"
                label="I confirm these records refer to the same child, not siblings."
                checked={confirmed}
                data-confirm
                onchange={acknowledge}
                disabled={busy}
              ></lightning-input>
            </div>
          </template>
        </div>
        <footer class="modal-footer slds-modal__footer">
          <button
            type="button"
            class="glass-button"
            data-action="close"
            onclick={closeModal}
            disabled={busy}
          >
            Close
          </button>
          <template lwc:if={isSelecting}>
            <button
              type="button"
              class="glass-button glass-button_prominent"
              data-action="compare"
              onclick={compareLeads}
              disabled={cannotCompare}
            >
              Compare Leads
            </button>
          </template>
          <template lwc:else>
            <button
              type="button"
              class="glass-button"
              data-action="back"
              data-step={previousStep}
              onclick={changeStep}
              disabled={busy}
            >
              Back
            </button>
            <template lwc:if={isComparing}>
              <button
                type="button"
                class="glass-button glass-button_prominent"
                data-action="confirm"
                data-step="confirm"
                onclick={changeStep}
              >
                Next
              </button>
            </template>
            <template lwc:else>
              <button
                type="button"
                class="glass-button glass-button_prominent"
                data-action="merge"
                onclick={mergeSelectedLeads}
                disabled={cannotMerge}
              >
                Merge Leads
              </button>
            </template>
          </template>
        </footer>
      </dialog>
    </template>
  </div>
</template>
